<ion-content [fullscreen]="true" class="ion-padding custom-dark">

  <ion-grid class="ion-text-center">
    <ion-row class="ion-justify-content-center ion-align-items-center" style="height: 100%;">
      <ion-col size-md="6" size-lg="4" size-sm="10">

        <ion-card class="form-card">
          <ion-card-header>
            <ion-card-title>Cadastro</ion-card-title>
          </ion-card-header>

          <ion-card-content>
            <ion-item>
              <ion-input 
                type="text" 
                label="Nome Completo" 
                label-placement="floating" 
                [(ngModel)]="usuario.name">
              </ion-input>
            </ion-item>

            <ion-item>
              <ion-input 
                type="email" 
                label="E-mail" 
                label-placement="floating" 
                [(ngModel)]="usuario.email">
              </ion-input>
            </ion-item>

            <ion-item>
              <ion-input 
                type="password" 
                label="Senha" 
                label-placement="floating" 
                [(ngModel)]="usuario.password">
              </ion-input>
            </ion-item>

            <ion-item>
              <ion-input 
                type="password" 
                label="Confirmar Senha" 
                label-placement="floating" 
                [(ngModel)]="usuario.password_confirmation">
              </ion-input>
            </ion-item>

            <ion-button expand="block" class="btn-register ion-margin-top" (click)="registrar()">
              Registrar/Logar
            </ion-button>
          </ion-card-content>
        </ion-card>

      </ion-col>
    </ion-row>
  </ion-grid>

</ion-content>
